- insert:
    - id: codexhost-bridge
      name: '@local/dsh-codexhost-bridge'
      config:
        nativeTurnTimeoutMs: 600000
        nativeCancelTimeoutMs: 10000
        autoStartHost: true
        hostStartTimeoutMs: 30000
        idleReleaseMinutes: 30
        generateMissingTitles: true
        nativeClaudeTitles: true
        claudeTitleModel: claude-haiku-5-5
        claudeTitleMaxOutputTokens: 512
        claudeTitleTimeoutMs: 30000
        claudeTitleMaxCostUsd: 0.05
        nativeInteractionApprovals: true
